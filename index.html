<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Packer: Side Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1710;--glow:#27402e;--panel:#0d1812;--btn:#1f2e22;--cream:#f0ebd8;--gold:#e5c76b;--muted:#8fa795;
--line:#34503b;--ok:#7bd88f;--bad:#e57373;
--pix:"Press Start 2P","Courier New",monospace;--mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 80% -10%,var(--glow),transparent 55%),linear-gradient(180deg,#14261a,var(--bg));background-attachment:fixed;
color:var(--cream);font-family:var(--mono);line-height:1.6;min-height:100vh;display:flex;justify-content:center;padding:44px 16px 56px}
main{width:100%;max-width:680px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kick{font-family:var(--pix);font-size:.7rem;letter-spacing:.5em;color:var(--muted);text-align:center;margin:0 0 22px}
h1{font-family:var(--pix);font-weight:400;font-size:clamp(1.3rem,6vw,2.4rem);line-height:1.35;text-align:center;margin:0 0 20px;text-transform:uppercase;text-shadow:4px 4px 0 #000}
h1 em{font-style:normal;color:var(--gold)}
.lead{text-align:center;color:var(--muted);margin:0 auto 36px;max-width:520px}
.panel{position:relative;background:var(--panel);border-top:6px solid var(--cream);border-left:6px solid var(--cream);padding:30px 22px 24px;margin-bottom:30px;
clip-path:polygon(0 14px,14px 14px,14px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%)}
.tag{position:absolute;top:0;right:16px;background:var(--cream);color:var(--bg);font-family:var(--pix);font-size:.55rem;padding:5px 9px}
h2{font-family:var(--pix);font-weight:400;font-size:.95rem;line-height:1.6;margin:0 0 10px;text-transform:uppercase}
.q{font-family:var(--mono);font-weight:700;font-size:1.05rem;text-transform:none;line-height:1.5}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 16px}
label{display:block;font-size:.75rem;letter-spacing:.15em;color:var(--muted);margin:18px 0 6px;text-transform:uppercase}
input[type=text]{width:100%;background:#fffef8;color:#16241a;border:3px solid #16241a;padding:14px;font-size:1rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.4em;margin:6px 0 0}
.btn{font-family:var(--pix);font-size:.8rem;text-transform:uppercase;background:var(--btn);border:0;padding:20px 22px;width:100%;letter-spacing:.08em}
.btn:hover:enabled,.btn.gold{background:var(--gold);color:#1a1606}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--pix);font-size:.6rem;margin-bottom:14px}
.top .xp{color:var(--gold)}
.top .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-family:var(--mono);font-size:.8rem;padding:4px}
.opts{display:grid;gap:12px}
.opt{background:var(--btn);border:3px solid var(--line);box-shadow:4px 4px 0 #000;padding:12px 14px;text-align:left;font-size:.92rem}
.opt:hover:enabled{border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:#1d3a25}
.opt.bad{border-color:var(--bad);background:#3d2222}
.opt:disabled{cursor:default;color:var(--cream)}
.code{background:#08110b;border:3px solid var(--line);padding:10px 0;margin:0 0 16px;overflow-x:auto;font-size:.9rem}
.cl{display:grid;grid-template-columns:38px 1fr;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:4px 10px 4px 0;white-space:pre}
.cl:hover:enabled{background:#16261b}
.cl .ln{color:var(--muted);text-align:right;padding-right:12px}
.cl.ok{background:#1d3a25;border-left-color:var(--ok)}
.cl.bad{background:#3d2222;border-left-color:var(--bad)}
.cl:disabled{color:var(--cream);cursor:default}
.snip{padding:22px 16px;min-height:96px;white-space:pre-wrap;word-break:break-word;font-size:1rem;margin:0 0 16px;border-width:4px;display:flex;align-items:center}
.snip.ok{border-color:var(--ok)} .snip.bad{border-color:var(--bad)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:flex;justify-content:space-between;font-family:var(--pix);font-size:.6rem;color:var(--muted);margin-bottom:14px}
.stats b{color:var(--gold);font-weight:400}
.idea{font-size:1.1rem;font-weight:700;background:var(--btn);border:3px solid var(--line);padding:18px;margin:0 0 16px}
.fb{margin-top:18px;padding:12px 14px;background:var(--btn);border-left:6px solid var(--line)}
.fb.ok{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--bad)}
.fb b{display:block;font-family:var(--pix);font-size:.7rem;font-weight:400;margin-bottom:6px}
.fb span{color:var(--muted);font-size:.9rem}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 6px;border-bottom:2px dashed var(--line)}
.board li.me{background:#1d3a25;color:var(--gold)}
.board .n{font-family:var(--pix);font-size:.65rem;color:var(--muted);padding-top:3px}
.board .s{font-family:var(--pix);font-size:.7rem;color:var(--gold);padding-top:2px}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{text-align:center;color:var(--muted);padding:12px 0;margin:0}
.big{font-family:var(--pix);font-size:clamp(1.8rem,9vw,3rem);color:var(--gold);text-align:center;text-shadow:4px 4px 0 #000;margin:6px 0}
.stat{text-align:center;color:var(--muted);margin:0 0 12px;font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mute{position:fixed;top:12px;right:12px;z-index:5;font-family:var(--pix);font-size:.55rem;background:var(--btn);color:var(--cream);border:3px solid var(--line);padding:10px 12px}
.mute:hover{border-color:var(--gold)}
.mute[aria-pressed="true"]{color:var(--muted)}
.stage{max-width:540px;margin:0 auto}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#08110b;border:3px solid var(--line);touch-action:none}
.dpad{display:none;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:8px;justify-content:center;margin-top:16px}
.dpad button{background:var(--btn);border:3px solid var(--line);font-family:var(--pix);font-size:1rem;touch-action:manipulation}
.dpad button:active{border-color:var(--gold);background:#2d4232}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media (pointer:coarse){.dpad{display:grid}}
.task{background:#08110b;border:3px solid var(--line);padding:12px 14px;margin-bottom:12px}
.task .tl{font-family:var(--pix);font-size:.55rem;color:var(--muted)}
.task .tn{display:block;font-weight:700;font-size:1.05rem;margin:6px 0 10px}
.need{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.need li{font-size:.88rem;border:2px dashed var(--ok);padding:4px 10px;color:var(--ok)}
.need li::before{content:"\25A1  "}
.need li.got{border-style:solid;background:#1d3a25;color:var(--cream)}
.need li.got::before{content:"\2713  "}
.steps{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:12px}
.steps li{border-left:4px solid var(--line);padding-left:12px;font-size:.92rem;color:var(--muted)}
.steps li.g{border-left-color:var(--ok)} .steps li.r{border-left-color:var(--bad)}
.steps b{display:block;color:var(--cream)}
.stage{position:relative}
.lesson{position:absolute;inset:0;background:rgba(8,17,11,.96);border:3px solid var(--gold);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px}
.lesson .ltag{font-family:var(--pix);font-size:.55rem;color:var(--ok)}
.lesson h3{font-family:var(--pix);font-weight:400;font-size:.85rem;line-height:1.6;margin:0;color:var(--gold);text-transform:uppercase}
.lesson p{margin:0 0 6px;font-size:.95rem}
.recap{margin:0;padding-left:20px;display:grid;gap:10px;font-size:.9rem;color:var(--muted)}
.recap b{color:var(--cream)}
@media (max-width:520px){.two{grid-template-columns:1fr}.btn{font-size:.7rem;padding:18px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== SETTINGS ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4Kq_DzYX8RDe1fc5gPEEkpk4ItT09_1AI1ekx4l4seni17sQAO2KX6ULWMeTtyVIFVw/exec";

/* ===== SHARED ===== */
const app=document.getElementById("app");
let player="", cleanup=null;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{a=a.slice();for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a};
const txt=(t,c,s)=>{const e=el(t,c);e.textContent=s;return e};
function panel(tag,title){const p=el("section","panel");p.append(txt("span","tag",tag),txt("h2","",title));return p}
function go(fn){if(cleanup){cleanup();cleanup=null}app.innerHTML="";fn();window.scrollTo(0,0)}
function hud(right){
  const d=el("div","top"), w=txt("span","who",player);
  const back=el("button","link","Change player"); back.onclick=home;
  d.append(w,back,txt("span","xp",right||"")); return d;
}
function setXP(s){const x=app.querySelector(".xp");if(x)x.textContent="XP "+s}
const best=(g,s)=>{let b=0;try{b=+localStorage.getItem("sq_"+g)||0;if(s>b){b=s;localStorage.setItem("sq_"+g,String(b))}}catch(e){}return Math.max(b,s)};

function boardPanel(game){
  const p=panel("Hall of fame","Top 10"), body=el("div"); p.append(body);
  p.reload=()=>loadBoard(body,game); p.reload(); return p;
}
async function loadBoard(body,game){
  const note=t=>{body.innerHTML="";body.append(txt("p","note",t))};
  if(!SCRIPT_URL){note("Leaderboard is not connected yet.");return}
  note("Loading scores...");
  try{
    const r=await fetch(SCRIPT_URL+"?game="+game+"&t="+Date.now()), d=await r.json();
    if(!d.ok||!d.scores.length){note("No scores yet. Be the first on the board.");return}
    const ol=el("ol","board");
    d.scores.forEach((s,n)=>{
      const li=el("li",String(s.name).toLowerCase()===player.toLowerCase()?"me":"");
      li.append(txt("span","n","#"+(n+1)),txt("span","nm",String(s.name)),txt("span","s",s.score+" XP")); ol.append(li);
    });
    body.innerHTML="";body.append(ol);
  }catch(e){note("Could not load scores. Check your connection and reload.")}
}
async function save(game,score,n,status,board){
  if(!SCRIPT_URL){status.textContent="Leaderboard not connected, so this score was not saved.";return}
  status.textContent="Saving your score...";
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({game:game,name:player,score:score,correct:n})});
    status.textContent="Score sent to the Hall of Fame.";setTimeout(board.reload,2000);
  }catch(e){
    status.textContent="Could not save your score. ";
    const r=el("button","link","Retry save"); r.onclick=()=>{r.remove();save(game,score,n,status,board)}; status.append(r);
  }
}
function finish(game,score,n,line,again){
  go(()=>{
    app.append(hud("XP "+score));
    const p=panel("Results","Quest complete"), st=txt("p","stat","");
    p.append(el("div","big",score+" XP"),txt("p","stat",line),txt("p","stat","Your best on this device: "+best(game,score)+" XP"),st);
    const two=el("div","two"), a=el("button","btn gold","Play again"), b=el("button","btn","Change player");
    a.onclick=again; b.onclick=home; two.append(a,b); p.append(two);
    const bd=boardPanel(game); app.append(p,bd); save(game,score,n,st,bd);
  });
}
function feedback(card,ok,head,why,nextLabel,onNext){
  card.append(el("div","fb "+(ok?"ok":"bad"),"<b></b><span></span>"));
  const f=card.lastChild; f.querySelector("b").textContent=head; f.querySelector("span").textContent=why;
  const nx=el("button","btn gold",nextLabel); nx.style.marginTop="18px"; nx.onclick=onNext; card.append(nx); nx.focus();
}

/* ===== MUSIC (generated in the browser) ===== */
const MUSIC_VOLUME = 0.05; /* 0 = silent, 0.05 = soft, 0.15 = loud */
const Music=(()=>{
  let ctx,master,filt,started=false,muted=false,step=0,next=0;
  try{muted=localStorage.getItem("founder_mute")==="1"}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12), SD=60/112/2;
  const CH=[{b:45,a:[57,60,64]},{b:41,a:[57,60,65]},{b:48,a:[55,60,64]},{b:43,a:[55,59,62]}];
  function tone(type,f,t,dur,vol){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(filt);o.start(t);o.stop(t+dur+0.05);
  }
  function kick(t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(g);g.connect(filt);o.start(t);o.stop(t+0.2);
  }
  function schedule(){
    while(next<ctx.currentTime+0.3){
      const c=CH[Math.floor(step/8)%CH.length], s=step%8;
      if(s===0||s===4){tone("triangle",hz(c.b),next,SD*3.5,0.5);kick(next)}
      tone("square",hz(c.a[[0,1,2,1,0,1,2,1][s]]+(s===6?12:0)),next,SD*0.9,0.12);
      step++;next+=SD;
    }
  }
  function start(){
    if(started){if(ctx.state==="suspended")ctx.resume();return}
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=muted?0:MUSIC_VOLUME;
      filt=ctx.createBiquadFilter();filt.type="lowpass";filt.frequency.value=2200;
      filt.connect(master);master.connect(ctx.destination);
      next=ctx.currentTime+0.1;setInterval(schedule,100);started=true;
    }catch(e){}
  }
  function sfx(ok){
    if(!started||muted)return;
    const t=ctx.currentTime;
    if(ok){tone("square",hz(76),t,0.1,0.3);tone("square",hz(83),t+0.1,0.18,0.3)}
    else tone("square",hz(52),t,0.25,0.3);
  }
  const btn=el("button","mute"); document.body.append(btn);
  function paint(){btn.textContent=muted?"Music: off":"Music: on";btn.setAttribute("aria-pressed",String(muted));btn.title="Turn background music "+(muted?"on":"off")}
  btn.onclick=()=>{
    muted=!muted;try{localStorage.setItem("founder_mute",muted?"1":"0")}catch(e){}
    if(!started&&!muted)start();
    if(started){master.gain.setTargetAtTime(muted?0:MUSIC_VOLUME,ctx.currentTime,0.05);if(!muted&&ctx.state==="suspended")ctx.resume()}
    paint();
  };
  document.addEventListener("visibilitychange",()=>{if(!started)return;if(document.hidden)ctx.suspend();else ctx.resume()});
  paint();
  return {start,sfx};
})();

/* ===== SCREENS ===== */
function home(){
  go(()=>{
    app.append(txt("p","kick","OPTIONAL"),el("h1","","Context <em>Packer</em>"),
      txt("p","lead","Your AI agent has a job to do. Catch the green cards it needs and dodge the junk. A 90-second optional side quest, just for fun and not part of the program."));
    const p=panel("Session","Enter your name");
    p.append(txt("p","hint","Your name appears on the Hall of Fame so everyone can see it."));
    const f=el("form");
    f.innerHTML='<label for="nm">Player name</label><input id="nm" type="text" maxlength="20" autocomplete="nickname" placeholder="e.g. codebreaker99"><p class="err" id="err" role="alert"></p>';
    const nm=f.querySelector("#nm"); nm.value=player;
    const go1=el("button","btn","&#9654; Press start"); go1.type="submit"; f.append(go1);
    f.onsubmit=e=>{
      e.preventDefault();
      const v=nm.value.replace(/[\u0000-\u001f<>]/g,"").trim();
      if(v.length<2){f.querySelector("#err").textContent="Enter a name with at least 2 characters.";nm.focus();return}
      player=v;Music.start();START();
    };
    p.append(f);app.append(p);nm.focus();
  });
}

/* ----- Context Packer (easy version) ----- */
const TASKS=[
 {t:"Write a travel order",need:["Traveler name","Travel dates","Travel order form"]},
 {t:"Reply to a student email",need:["Student's email","Enrollment schedule","Reply template"]},
 {t:"Book a meeting room",need:["Date and time","Number of people","Room booking form"]},
 {t:"Summarize weekly attendance",need:["Attendance sheet","Staff list","Summary format"]},
 {t:"Process a leave request",need:["Leave form","Leave policy","Supervisor name"]},
 {t:"Post an event bulletin",need:["Event details","Event poster","Bulletin template"]},
 {t:"Write staff meeting minutes",need:["Meeting notes","Attendee list","Minutes template"]},
 {t:"Order new laptops",need:["Purchase form","Approved budget","Supplier quote"]}
];
const JUNK=["Cat meme","Lunch menu","Random tweet","Spam email","Old group chat","Movie trailer","Birthday GIF","Shopping cart","Horoscope","Weather in Paris"];
const LESSONS=[
 ["Context is what the AI can see","An AI only knows what you put in front of it: your instructions, files, and earlier messages. If something is missing, it guesses."],
 ["Less is more","Extra or irrelevant information makes an AI slower and more likely to make mistakes. Give it only what the task needs."],
 ["Use current information","Old templates and outdated schedules give outdated answers. Check that every file is the latest version before sharing it."],
 ["Protect private data","Passwords, personal records, and confidential files do not belong in an AI's context. Share only what the task requires."],
 ["Good context has parts","A strong setup includes the task, the right data, a template or format, and the rules to follow. This is called context engineering."]
];
const W=480,H=520,AY=H-64,TIME=90,GOAL=5; /* 5 tasks x 10 XP = 50 XP maximum */
const pick=a=>a[Math.floor(Math.random()*a.length)];

function intro(){
  go(()=>{
    app.append(hud(""));
    const p=panel("How to play","Pack the context");
    p.append(txt("p","hint","Context is the information you give an AI so it can do a job well. With too little, it guesses. With too much, it gets confused. Here is how the game works."));
    const ul=el("ul","steps");
    [["","1. Move the agent","Drag with your mouse or finger, or use the left and right arrow keys."],
     ["g","2. Catch the green cards","They match the checklist above the game. Collect all three to finish the task."],
     ["r","3. Dodge the dark cards","They are junk. Catching one costs you 2 XP."]].forEach(([c,h,s])=>{
      const li=el("li",c);li.append(txt("b","",h),txt("span","",s));ul.append(li);
    });
    p.append(ul,txt("p","hint","Finish "+GOAL+" tasks within "+TIME+" seconds. Each task is worth 10 XP, so 50 XP is the top score."));
    const b=el("button","btn gold","Start the run"); b.onclick=play; p.append(b); app.append(p); b.focus();
  });
}

function play(){
  go(()=>{
    app.append(hud("XP 0"));
    const p=panel("Context Packer","Feed the agent");
    const stats=el("div","stats"), tEl=el("b","",String(TIME)), dEl=el("b","","0 / "+GOAL);
    const tb=el("span","","Time: "); tb.append(tEl); const db=el("span","","Tasks done: "); db.append(dEl); stats.append(tb,db);
    const task=el("div","task"), tl=txt("span","tl",""), tn=txt("span","tn",""), ul=el("ul","need"); task.append(tl,tn,ul);
    const stage=el("div","stage"), cv=el("canvas"); cv.width=W; cv.height=H; stage.append(cv);
    cv.setAttribute("aria-label","Game area: move the agent to catch the green cards");
    p.append(stats,task,stage); app.append(p);
    const g=cv.getContext("2d");

    let lessonOpen=false,lessons=0,score=0,done=0,good=0,junk=0,timeLeft=TIME,ready=3,trans=0,over=false,spawnT=0.4,mood=0,moodT=0,banner=0,lastCount=4;
    let order=[],cur=null,got=new Set();
    const items=[],pops=[],stars=[],ag={x:W/2,tx:W/2,w:120};
    for(let i=0;i<30;i++)stars.push({x:Math.random()*W,y:Math.random()*H,v:15+Math.random()*40});

    function render(){
      tl.textContent="TASK "+Math.min(done+1,GOAL)+" OF "+GOAL; tn.textContent=cur.t; ul.innerHTML="";
      cur.need.forEach(n=>ul.append(txt("li",got.has(n)?"got":"",n)));
    }
    function nextTask(){
      if(!order.length)order=shuffle(TASKS);
      cur=order.pop(); got=new Set(); items.length=0; render();
    }
    function pop(x,y,s,c){pops.push({x,y,s,c,t:1})}
    function spawn(){
      if(items.length>=5)return;
      const missing=cur.need.filter(n=>!got.has(n)&&!items.some(i=>i.s===n));
      const needNow=missing.length&&(Math.random()<0.55||!items.some(i=>i.need));
      const s=needNow?pick(missing):pick(JUNK);
      g.font="bold 15px 'Space Mono', monospace";
      const w=Math.min(W-20,g.measureText(s).width+28), h=34;
      let x=10+Math.random()*(W-w-20);
      for(let k=0;k<8&&items.some(i=>i.y<60&&Math.abs(i.x-x)<i.w);k++)x=10+Math.random()*(W-w-20);
      items.push({x,y:-h,w,h,s,need:!!needNow,vy:85+Math.min(done,6)*5});
    }
    function grab(it){
      const cx=it.x+it.w/2;
      if(it.need){
        got.add(it.s);good++;score+=3;mood=1;moodT=0.4;pop(cx,AY-24,"+3","#7bd88f");Music.sfx(true);render();
        if(cur.need.every(n=>got.has(n))){
          done++;score+=1;items.length=0;Music.sfx(true);task.querySelectorAll("li").forEach(l=>l.className="got");showLesson();
        }
      }else{
        junk++;score=Math.max(0,score-2);mood=2;moodT=0.5;pop(cx,AY-24,"-2","#e57373");Music.sfx(false);
      }
    }
    function showLesson(){
      hudUpdate();lessons=done;lessonOpen=true;
      const L=LESSONS[done-1], o=el("div","lesson");
      const b=el("button","btn gold",done>=GOAL?"See my results":"Next task");
      b.onclick=()=>{o.remove();lessonOpen=false;if(done>=GOAL)end();else nextTask()};
      o.append(txt("span","ltag","TASK DONE. +1 BONUS XP"),txt("h3","",L[0]),txt("p","",L[1]),b);
      stage.append(o);b.focus();
    }
    function end(){
      if(over)return;over=true;cleanup();cleanup=null;
      finish("contextpacker",score,done,done+" of "+GOAL+" tasks finished, "+good+" items packed, "+junk+" junk caught.",intro);
      if(lessons){
        const rp=panel("Recap","What you learned"), ol=el("ol","recap");
        LESSONS.slice(0,lessons).forEach(l=>{const li=el("li");li.append(txt("b","",l[0]+". "),txt("span","",l[1]));ol.append(li)});
        rp.append(ol);app.insertBefore(rp,app.lastElementChild);
      }
    }
    let shown={};
    function hudUpdate(){
      const t=Math.ceil(timeLeft);
      if(shown.s!==score){shown.s=score;setXP(score)}
      if(shown.t!==t){shown.t=t;tEl.textContent=t}
      if(shown.d!==done){shown.d=done;dEl.textContent=done+" / "+GOAL}
    }
    const keys={};
    function update(dt){
      if(moodT>0)moodT-=dt; if(banner>0)banner-=dt;
      for(let i=pops.length-1;i>=0;i--){const o=pops[i];o.t-=dt*0.9;o.y-=34*dt;if(o.t<=0)pops.splice(i,1)}
      for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
      const kx=(keys.r?1:0)-(keys.l?1:0);
      if(kx)ag.tx=Math.max(0,Math.min(W,ag.tx+kx*520*dt));
      ag.x+=(ag.tx-ag.x)*Math.min(1,dt*16);
      ag.x=Math.max(ag.w/2,Math.min(W-ag.w/2,ag.x));
      if(over||lessonOpen)return;
      if(ready>0){
        ready-=dt;const c=Math.ceil(ready);
        if(c!==lastCount&&c>0){lastCount=c;Music.sfx(true)}
        return;
      }
      if(trans>0){trans-=dt;if(trans<=0){if(done>=GOAL){hudUpdate();return end()}nextTask()}return}
      timeLeft-=dt;
      if(timeLeft<=0){timeLeft=0;hudUpdate();return end()}
      spawnT-=dt;
      if(spawnT<=0){spawn();spawnT=Math.max(0.7,1.05-done*0.04)}
      const l=ag.x-ag.w/2,r=ag.x+ag.w/2;
      for(let i=items.length-1;i>=0;i--){
        const it=items[i];it.y+=it.vy*dt;
        if(it.y+it.h>=AY-4&&it.y+it.h<=AY+22&&it.x+it.w>l+6&&it.x<r-6){items.splice(i,1);grab(it);if(lessonOpen)break;continue}
        if(it.y>H)items.splice(i,1);
      }
      hudUpdate();
    }
    function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
    function draw(t){
      g.fillStyle="#08110b";g.fillRect(0,0,W,H);
      g.fillStyle="#34503b";for(const s of stars)g.fillRect(s.x,s.y,2,s.v/12);
      g.textAlign="center";g.textBaseline="middle";g.font="bold 15px 'Space Mono', monospace";
      for(const it of items){
        g.fillStyle="#000";rr(it.x+3,it.y+3,it.w,it.h,4);g.fill();
        if(it.need){g.fillStyle="#7bd88f";rr(it.x,it.y,it.w,it.h,4);g.fill();g.fillStyle="#0c1710"}
        else{g.fillStyle="#3b2323";rr(it.x,it.y,it.w,it.h,4);g.fill();g.strokeStyle="#e57373";g.lineWidth=2;g.stroke();g.fillStyle="#f0ebd8"}
        g.fillText(it.s,it.x+it.w/2,it.y+it.h/2+1);
      }
      const ax=ag.x,aw=ag.w,by=AY+4;
      g.fillStyle="#e5c76b";g.fillRect(ax-aw/2,AY-4,aw,6);g.fillRect(ax-aw/2,AY-12,6,10);g.fillRect(ax+aw/2-6,AY-12,6,10);
      g.fillStyle="#2a4a35";rr(ax-29,by,58,40,6);g.fill();g.strokeStyle="#7bd88f";g.lineWidth=2;g.stroke();
      g.fillStyle="#08110b";rr(ax-23,by+6,46,22,3);g.fill();
      const m=moodT>0?mood:0;
      g.strokeStyle=m===2?"#e57373":"#7bd88f";g.fillStyle=g.strokeStyle;g.lineWidth=2;
      if(m===1){g.beginPath();g.moveTo(ax-15,by+19);g.lineTo(ax-10,by+13);g.lineTo(ax-5,by+19);g.moveTo(ax+5,by+19);g.lineTo(ax+10,by+13);g.lineTo(ax+15,by+19);g.stroke()}
      else if(m===2){g.beginPath();g.moveTo(ax-15,by+12);g.lineTo(ax-7,by+20);g.moveTo(ax-7,by+12);g.lineTo(ax-15,by+20);g.moveTo(ax+7,by+12);g.lineTo(ax+15,by+20);g.moveTo(ax+15,by+12);g.lineTo(ax+7,by+20);g.stroke()}
      else{g.fillRect(ax-14,by+12,6,8);g.fillRect(ax+8,by+12,6,8)}
      g.fillStyle="#7bd88f";g.fillRect(ax-1,by-8,2,8);g.beginPath();g.arc(ax,by-9,3,0,Math.PI*2);g.fill();
      g.font="bold 16px 'Space Mono', monospace";
      for(const o of pops){g.globalAlpha=Math.max(0,Math.min(1,o.t*1.5));g.fillStyle="#000";g.fillText(o.s,o.x+2,o.y+2);g.fillStyle=o.c;g.fillText(o.s,o.x,o.y)}
      g.globalAlpha=1;
      if(ready>0){
        g.fillStyle="rgba(8,17,11,.75)";g.fillRect(0,0,W,H);
        g.fillStyle="#8fa795";g.font="bold 15px monospace";g.fillText("YOUR TASK",W/2,H/2-70);
        g.fillStyle="#f0ebd8";g.font="bold 22px monospace";g.fillText(cur?cur.t:"",W/2,H/2-36);
        g.fillStyle="#e5c76b";g.font="bold 54px monospace";g.fillText(String(Math.ceil(ready)),W/2,H/2+30);
      }else if(banner>0){
        g.globalAlpha=Math.min(1,banner*3);g.font="bold 30px monospace";g.fillStyle="#000";g.fillText("AGENT RAN!",W/2+3,H/2-30+3);g.fillStyle="#7bd88f";g.fillText("AGENT RAN!",W/2,H/2-30);g.globalAlpha=1;
      }
    }
    const toX=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left)*W/r.width};
    cv.addEventListener("pointermove",e=>{ag.tx=toX(e)});
    cv.addEventListener("pointerdown",e=>{e.preventDefault();ag.tx=toX(e)});
    const KL={ArrowLeft:"l",a:"l",A:"l",ArrowRight:"r",d:"r",D:"r"};
    const kd=e=>{if(KL[e.key]){e.preventDefault();keys[KL[e.key]]=true;ag.tx=ag.x}};
    const ku=e=>{if(KL[e.key])keys[KL[e.key]]=false};
    document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);

    nextTask();
    let last=0,raf;
    const loop=ts=>{
      raf=requestAnimationFrame(loop);
      const dt=Math.min(0.05,(ts-(last||ts))/1000);last=ts;
      update(dt);if(!over)draw(ts/1000);
    };
    raf=requestAnimationFrame(loop);
    cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku)};
  });
}
const START=intro;
home();
</script>
</body>
</html>
