<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1710;--glow:#27402e;--panel:#0d1812;--btn:#1f2e22;--cream:#f0ebd8;--gold:#e5c76b;--muted:#8fa795;
--line:#34503b;--ok:#7bd88f;--bad:#e57373;
--pix:"Press Start 2P","Courier New",monospace;--mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 80% -10%,var(--glow),transparent 55%),linear-gradient(180deg,#14261a,var(--bg));background-attachment:fixed;
color:var(--cream);font-family:var(--mono);line-height:1.6;min-height:100vh;display:flex;justify-content:center;padding:44px 16px 56px}
main{width:100%;max-width:680px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kick{font-family:var(--pix);font-size:.7rem;letter-spacing:.5em;color:var(--muted);text-align:center;margin:0 0 22px}
h1{font-family:var(--pix);font-weight:400;font-size:clamp(1.3rem,6vw,2.4rem);line-height:1.35;text-align:center;margin:0 0 20px;text-transform:uppercase;text-shadow:4px 4px 0 #000}
h1 em{font-style:normal;color:var(--gold)}
.lead{text-align:center;color:var(--muted);margin:0 auto 36px;max-width:520px}
.panel{position:relative;background:var(--panel);border-top:6px solid var(--cream);border-left:6px solid var(--cream);padding:30px 22px 24px;margin-bottom:30px;
clip-path:polygon(0 14px,14px 14px,14px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%)}
.tag{position:absolute;top:0;right:16px;background:var(--cream);color:var(--bg);font-family:var(--pix);font-size:.55rem;padding:5px 9px}
h2{font-family:var(--pix);font-weight:400;font-size:.95rem;line-height:1.6;margin:0 0 10px;text-transform:uppercase}
.q{font-family:var(--mono);font-weight:700;font-size:1.05rem;text-transform:none;line-height:1.5}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 16px}
label{display:block;font-size:.75rem;letter-spacing:.15em;color:var(--muted);margin:18px 0 6px;text-transform:uppercase}
input[type=text]{width:100%;background:#fffef8;color:#16241a;border:3px solid #16241a;padding:14px;font-size:1rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.4em;margin:6px 0 0}
.btn{font-family:var(--pix);font-size:.8rem;text-transform:uppercase;background:var(--btn);border:0;padding:20px 22px;width:100%;letter-spacing:.08em}
.btn:hover:enabled,.btn.gold{background:var(--gold);color:#1a1606}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--pix);font-size:.6rem;margin-bottom:14px}
.top .xp{color:var(--gold)}
.top .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-family:var(--mono);font-size:.8rem;padding:4px}
.opts{display:grid;gap:12px}
.opt{background:var(--btn);border:3px solid var(--line);box-shadow:4px 4px 0 #000;padding:12px 14px;text-align:left;font-size:.92rem}
.opt:hover:enabled{border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:#1d3a25}
.opt.bad{border-color:var(--bad);background:#3d2222}
.opt:disabled{cursor:default;color:var(--cream)}
.code{background:#08110b;border:3px solid var(--line);padding:10px 0;margin:0 0 16px;overflow-x:auto;font-size:.9rem}
.cl{display:grid;grid-template-columns:38px 1fr;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:4px 10px 4px 0;white-space:pre}
.cl:hover:enabled{background:#16261b}
.cl .ln{color:var(--muted);text-align:right;padding-right:12px}
.cl.ok{background:#1d3a25;border-left-color:var(--ok)}
.cl.bad{background:#3d2222;border-left-color:var(--bad)}
.cl:disabled{color:var(--cream);cursor:default}
.snip{padding:22px 16px;min-height:96px;white-space:pre-wrap;word-break:break-word;font-size:1rem;margin:0 0 16px;border-width:4px;display:flex;align-items:center}
.snip.ok{border-color:var(--ok)} .snip.bad{border-color:var(--bad)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:flex;justify-content:space-between;font-family:var(--pix);font-size:.6rem;color:var(--muted);margin-bottom:14px}
.stats b{color:var(--gold);font-weight:400}
.idea{font-size:1.1rem;font-weight:700;background:var(--btn);border:3px solid var(--line);padding:18px;margin:0 0 16px}
.fb{margin-top:18px;padding:12px 14px;background:var(--btn);border-left:6px solid var(--line)}
.fb.ok{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--bad)}
.fb b{display:block;font-family:var(--pix);font-size:.7rem;font-weight:400;margin-bottom:6px}
.fb span{color:var(--muted);font-size:.9rem}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 6px;border-bottom:2px dashed var(--line)}
.board li.me{background:#1d3a25;color:var(--gold)}
.board .n{font-family:var(--pix);font-size:.65rem;color:var(--muted);padding-top:3px}
.board .s{font-family:var(--pix);font-size:.7rem;color:var(--gold);padding-top:2px}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{text-align:center;color:var(--muted);padding:12px 0;margin:0}
.big{font-family:var(--pix);font-size:clamp(1.8rem,9vw,3rem);color:var(--gold);text-align:center;text-shadow:4px 4px 0 #000;margin:6px 0}
.stat{text-align:center;color:var(--muted);margin:0 0 12px;font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mute{position:fixed;top:12px;right:12px;z-index:5;font-family:var(--pix);font-size:.55rem;background:var(--btn);color:var(--cream);border:3px solid var(--line);padding:10px 12px}
.mute:hover{border-color:var(--gold)}
.mute[aria-pressed="true"]{color:var(--muted)}
.stage{max-width:540px;margin:0 auto}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#08110b;border:3px solid var(--line);touch-action:none}
.dpad{display:none;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:8px;justify-content:center;margin-top:16px}
.dpad button{background:var(--btn);border:3px solid var(--line);font-family:var(--pix);font-size:1rem;touch-action:manipulation}
.dpad button:active{border-color:var(--gold);background:#2d4232}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media (pointer:coarse){.dpad{display:grid}}
.meters{display:grid;gap:8px;margin:0 0 16px}
.mt{display:grid;grid-template-columns:104px 1fr 40px;gap:10px;align-items:center;font-size:.8rem;color:var(--muted)}
.mt .bar{height:14px;background:#08110b;border:3px solid var(--line);position:relative;overflow:hidden}
.mt .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ok);transition:width .6s steps(10)}
.mt .bar i.mid{background:#e5a96b} .mt .bar i.low{background:var(--bad)}
.mt b{font-family:var(--pix);font-size:.55rem;font-weight:400;color:var(--cream);text-align:right}
.story{font-size:.98rem;margin:0 0 14px;color:var(--cream)}
.mod{font-family:var(--pix);font-size:.5rem;color:var(--muted);margin:0 0 10px;line-height:1.7}
.opt.sel{border-color:var(--gold);background:#2d4232}
.deltas{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.dl{font-family:var(--pix);font-size:.5rem;padding:5px 8px;border:2px solid var(--line);color:var(--muted)}
.dl.up{border-color:var(--ok);color:var(--ok)} .dl.down{border-color:var(--bad);color:var(--bad)}
.progress{height:20px;background:#08110b;border:3px solid var(--line);margin:18px 0}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width 2.2s steps(22)}
.recap{margin:0;padding-left:20px;display:grid;gap:8px;font-size:.88rem;color:var(--muted)}
.recap b{color:var(--cream)}
.app{background:#fffef8;color:#16241a;border:3px solid #16241a;max-width:400px;margin:4px auto 16px;font-size:.85rem;box-shadow:6px 6px 0 #000}
.app .top2{background:#16301f;color:var(--cream);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.app .top2 b{font-family:var(--pix);font-size:.6rem;font-weight:400;text-transform:uppercase}
.app .sub{padding:6px 12px;background:#efe8d0;font-size:.75rem}
.app .alert{margin:8px 12px 0;padding:7px 10px;border-left:5px solid;font-size:.76rem}
.alert.good{background:#dff3e4;border-color:#2f9e5a} .alert.warn{background:#fff1d6;border-color:#d9962b} .alert.bad{background:#fde0de;border-color:#c0392b}
.app ul.menu{list-style:none;margin:8px 12px;padding:0}
.app ul.menu li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #b9b29a}
.app .add{background:#16301f;color:#f0ebd8;border:0;padding:5px 10px;font-family:var(--pix);font-size:.5rem}
.app .acts{display:flex;gap:8px;padding:4px 12px 10px}
.app .acts button{flex:1;background:var(--gold);color:#1a1606;border:2px solid #16241a;padding:9px 4px;font-family:var(--pix);font-size:.5rem;text-transform:uppercase}
.app .acts button.alt{background:#fffef8}
.app .msg{margin:0 12px 12px;padding:8px 10px;background:#16301f;color:var(--cream);font-size:.78rem;min-height:3.2em}
.app .stats3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:3px solid #16241a}
.app .stats3 div{padding:8px 4px;font-size:.7rem;border-right:2px solid #16241a}
.app .stats3 div:last-child{border-right:0}
.app .stats3 b{display:block;font-family:var(--pix);font-size:.7rem;font-weight:400}
@media (max-width:520px){.two{grid-template-columns:1fr}.btn{font-size:.7rem;padding:18px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== SETTINGS ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4Kq_DzYX8RDe1fc5gPEEkpk4ItT09_1AI1ekx4l4seni17sQAO2KX6ULWMeTtyVIFVw/exec";

/* ===== SHARED ===== */
const app=document.getElementById("app");
let player="", cleanup=null;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{a=a.slice();for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a};
const txt=(t,c,s)=>{const e=el(t,c);e.textContent=s;return e};
function panel(tag,title){const p=el("section","panel");if(tag)p.append(txt("span","tag",tag));p.append(txt("h2","",title));return p}
function go(fn){if(cleanup){cleanup();cleanup=null}app.innerHTML="";fn();window.scrollTo(0,0)}
function hud(right){
  const d=el("div","top"), w=txt("span","who",player);
  const back=el("button","link","Change player"); back.onclick=home;
  d.append(w,back,txt("span","xp",right||"")); return d;
}
function setXP(s){const x=app.querySelector(".xp");if(x)x.textContent="XP "+s}
const best=(g,s)=>{let b=0;try{b=+localStorage.getItem("sq_"+g)||0;if(s>b){b=s;localStorage.setItem("sq_"+g,String(b))}}catch(e){}return Math.max(b,s)};

function boardPanel(game){
  const p=panel("Hall of fame","Top 10"), body=el("div"); p.append(body);
  p.reload=()=>loadBoard(body,game); p.reload(); return p;
}
async function loadBoard(body,game){
  const note=t=>{body.innerHTML="";body.append(txt("p","note",t))};
  if(!SCRIPT_URL){note("Leaderboard is not connected yet.");return}
  note("Loading scores...");
  try{
    const r=await fetch(SCRIPT_URL+"?game="+game+"&t="+Date.now()), d=await r.json();
    if(!d.ok||!d.scores.length){note("No scores yet. Be the first on the board.");return}
    const ol=el("ol","board");
    d.scores.forEach((s,n)=>{
      const li=el("li",String(s.name).toLowerCase()===player.toLowerCase()?"me":"");
      li.append(txt("span","n","#"+(n+1)),txt("span","nm",String(s.name)),txt("span","s",s.score+" XP")); ol.append(li);
    });
    body.innerHTML="";body.append(ol);
  }catch(e){note("Could not load scores. Check your connection and reload.")}
}
async function save(game,score,n,status,board){
  if(!SCRIPT_URL){status.textContent="Leaderboard not connected, so this score was not saved.";return}
  status.textContent="Saving your score...";
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({game:game,name:player,score:score,correct:n})});
    status.textContent="Score sent to the Hall of Fame.";setTimeout(board.reload,2000);
  }catch(e){
    status.textContent="Could not save your score. ";
    const r=el("button","link","Retry save"); r.onclick=()=>{r.remove();save(game,score,n,status,board)}; status.append(r);
  }
}
function finish(game,score,n,line,again){
  go(()=>{
    app.append(hud("XP "+score));
    const p=panel("Results","Quest complete"), st=txt("p","stat","");
    p.append(el("div","big",score+" XP"),txt("p","stat",line),txt("p","stat","Your best on this device: "+best(game,score)+" XP"),st);
    const two=el("div","two"), a=el("button","btn gold","Play again"), b=el("button","btn","Change player");
    a.onclick=again; b.onclick=home; two.append(a,b); p.append(two);
    const bd=boardPanel(game); app.append(p,bd); save(game,score,n,st,bd);
  });
}
function feedback(card,ok,head,why,nextLabel,onNext){
  card.append(el("div","fb "+(ok?"ok":"bad"),"<b></b><span></span>"));
  const f=card.lastChild; f.querySelector("b").textContent=head; f.querySelector("span").textContent=why;
  const nx=el("button","btn gold",nextLabel); nx.style.marginTop="18px"; nx.onclick=onNext; card.append(nx); nx.focus();
}

/* ===== MUSIC (generated in the browser) ===== */
const MUSIC_VOLUME = 0.05; /* 0 = silent, 0.05 = soft, 0.15 = loud */
const Music=(()=>{
  let ctx,master,filt,started=false,muted=false,step=0,next=0;
  try{muted=localStorage.getItem("founder_mute")==="1"}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12), SD=60/112/2;
  const CH=[{b:45,a:[57,60,64]},{b:41,a:[57,60,65]},{b:48,a:[55,60,64]},{b:43,a:[55,59,62]}];
  function tone(type,f,t,dur,vol){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(filt);o.start(t);o.stop(t+dur+0.05);
  }
  function kick(t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(g);g.connect(filt);o.start(t);o.stop(t+0.2);
  }
  function schedule(){
    while(next<ctx.currentTime+0.3){
      const c=CH[Math.floor(step/8)%CH.length], s=step%8;
      if(s===0||s===4){tone("triangle",hz(c.b),next,SD*3.5,0.5);kick(next)}
      tone("square",hz(c.a[[0,1,2,1,0,1,2,1][s]]+(s===6?12:0)),next,SD*0.9,0.12);
      step++;next+=SD;
    }
  }
  function start(){
    if(started){if(ctx.state==="suspended")ctx.resume();return}
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=muted?0:MUSIC_VOLUME;
      filt=ctx.createBiquadFilter();filt.type="lowpass";filt.frequency.value=2200;
      filt.connect(master);master.connect(ctx.destination);
      next=ctx.currentTime+0.1;setInterval(schedule,100);started=true;
    }catch(e){}
  }
  function sfx(ok){
    if(!started||muted)return;
    const t=ctx.currentTime;
    if(ok){tone("square",hz(76),t,0.1,0.3);tone("square",hz(83),t+0.1,0.18,0.3)}
    else tone("square",hz(52),t,0.25,0.3);
  }
  const btn=el("button","mute"); document.body.append(btn);
  function paint(){btn.textContent=muted?"Music: off":"Music: on";btn.setAttribute("aria-pressed",String(muted));btn.title="Turn background music "+(muted?"on":"off")}
  btn.onclick=()=>{
    muted=!muted;try{localStorage.setItem("founder_mute",muted?"1":"0")}catch(e){}
    if(!started&&!muted)start();
    if(started){master.gain.setTargetAtTime(muted?0:MUSIC_VOLUME,ctx.currentTime,0.05);if(!muted&&ctx.state==="suspended")ctx.resume()}
    paint();
  };
  document.addEventListener("visibilitychange",()=>{if(!started)return;if(document.hidden)ctx.suspend();else ctx.resume()});
  paint();
  return {start,sfx};
})();

/* ===== SCREENS ===== */
function home(){
  go(()=>{
    app.append(txt("p","kick","START"),el("h1","","Launch <em>Day</em>"),
      txt("p","lead","Run a mini startup through 5 decisions. Your choices build the product you launch at the end."));
    const p=panel("","Enter your name");
    p.append(txt("p","hint","Your name appears on the Hall of Fame so everyone can see it."));
    const f=el("form");
    f.innerHTML='<label for="nm">Player name</label><input id="nm" type="text" maxlength="20" autocomplete="nickname" placeholder="e.g. codebreaker99"><p class="err" id="err" role="alert"></p>';
    const nm=f.querySelector("#nm"); nm.value=player;
    const go1=el("button","btn","&#9654; Press start"); go1.type="submit"; f.append(go1);
    f.onsubmit=e=>{
      e.preventDefault();
      const v=nm.value.replace(/[\u0000-\u001f<>]/g,"").trim();
      if(v.length<2){f.querySelector("#err").textContent="Enter a name with at least 2 characters.";nm.focus();return}
      player=v;Music.start();START();
    };
    p.append(f);app.append(p);nm.focus();
  });
}

/* ----- Launch Day ----- */
const KEYS=["dq","sec","tru"], LABELS=["Data quality","Security","Trust"];
const RANKS=[[50,"Unicorn Founder"],[35,"Seed-Funded Startup"],[20,"Promising Side Project"],[0,"Back to the drawing board"]];
/* Each decision: 3 options. xp = 10 best, 5 okay, 0 risky. m = change to [data quality, security, trust]. f = flag used to build the product. */
const STAGES=[
 {key:"data",mod:"Module 4: Python for EDA",title:"The messy data",
  story:"Your first export from three carinderias has duplicate rows, blank prices, and typos like \"Manilla\". An AI assistant offers to tidy it for you. What do you do?",
  opts:[
   {t:"Clean it with pandas: drop duplicates, fill the blanks, fix the typos. Then check the result.",xp:10,m:[30,0,5],f:"clean",res:"Cleaning first means every later step builds on data you can trust. Checking the result is how you treat an AI's work too."},
   {t:"Let the AI clean it and use the result without looking.",xp:5,m:[15,0,-5],f:"ai",res:"The AI fixed most problems, but nobody checked. A confident AI can still be wrong, so compare with the source."},
   {t:"Skip cleaning. Customers will not notice.",xp:0,m:[-20,0,-10],f:"dirty",res:"Duplicates and blanks flow into every screen and report. Customers do notice wrong prices."}]},
 {key:"db",mod:"Module 5: Database setup, data loading, schema",title:"Building the database",
  story:"Your data is ready to be stored. Customers, restaurants, and orders all need to connect. How do you set it up?",
  opts:[
   {t:"Make separate tables with primary keys, load the CSV, and link orders to customers with a foreign key.",xp:10,m:[10,5,5],f:"linked",res:"Separate tables with keys keep data consistent. A foreign key guarantees every order belongs to a real customer."},
   {t:"Put everything into one big table.",xp:5,m:[-5,0,0],f:"onetable",res:"It works at first, but names and addresses repeat in every row, and mistakes multiply."},
   {t:"Keep it in a shared spreadsheet and email updates.",xp:0,m:[-10,-10,-5],f:"sheet",res:"Spreadsheets get overwritten and have no keys or links. It will not scale."}]},
 {key:"sec",mod:"Module 5: Security, roles and authorization",title:"Who gets access?",
  story:"Your team is growing: an owner, two analysts, and an intern. Everyone wants into the database.",
  opts:[
   {t:"Create roles: read-only for analysts, full access for the owner only, and a strong password for each person.",xp:10,m:[0,30,10],f:"roles",res:"Least privilege: each person gets only the access they need, and every login is traceable."},
   {t:"Protect the database with one password and no separate roles.",xp:5,m:[0,5,0],f:"pwonly",res:"A password helps, but without roles anyone who has it can change or delete anything."},
   {t:"Share one admin login so nobody gets blocked.",xp:0,m:[0,-30,-15],f:"shared",res:"Shared admin logins hide who did what and give everyone far too much power."}]},
 {key:"app",mod:"Module 5: Simple web app, API calls (CRUD, SQL)",title:"The app and its API",
  story:"Customers need to see the menu and edit their orders from your web app. The app talks to the database through an API.",
  opts:[
   {t:"Use PATCH on the order, and run an UPDATE with a WHERE clause that uses parameters.",xp:10,m:[5,10,10],f:"safe",res:"PATCH maps to UPDATE for one record. Parameters stop user input from being run as SQL."},
   {t:"Join the customer's text straight into the SQL query to save time.",xp:0,m:[0,-30,-15],f:"inject",res:"That opens the door to SQL injection, where a trick typed in a form can change or delete everyone's data."},
   {t:"Build only viewing (SELECT) for now and skip editing.",xp:5,m:[0,5,-5],f:"readonly",res:"Safe, but customers cannot fix mistakes, so the product feels unfinished."}]},
 {key:"pitch",mod:"Module 6: Technopreneurship",title:"Launch and pitch",
  story:"Launch day! Investors are watching. How do you take the product to market?",
  opts:[
   {t:"Talk to 10 real users, launch a simple MVP, and share real numbers.",xp:10,m:[0,0,25],f:"users",res:"Evidence beats guesses. A simple MVP plus real user numbers is what investors trust."},
   {t:"Launch with every feature and a big ad budget.",xp:5,m:[0,0,5],f:"features",res:"More features cost more, and many go unused. Start with the core problem."},
   {t:"Pitch big claims even though nobody has used it yet.",xp:0,m:[0,0,-20],f:"hype",res:"Investors ask for proof. Claims without users hurt trust."}]}
];
const MENU={
 clean:[["Chicken adobo","85"],["Sinigang na baboy","95"],["Pancit canton","70"]],
 ai:[["Chicken adobo","85"],["Sinigang na baboy","95"],["Pancit canton","7"]],
 dirty:[["Chicken adobo","85"],["Chicken adobo","85"],["Sinigang","blank"]]
};
let startup="Carinderia Go", M, XP, picks;

function intro(){
  go(()=>{
    app.append(hud(""));
    const p=panel("The story","Your startup");
    p.append(txt("p","story","You are launching an app that lets office workers order lunch from neighborhood carinderias. Over 5 decisions you will clean data, build a database, protect it, connect a web app, and pitch it. Your choices shape the real product you launch at the end."));
    const f=el("form");
    f.innerHTML='<label for="sn">Startup name</label><input id="sn" type="text" maxlength="24" placeholder="e.g. Carinderia Go">';
    const sn=f.querySelector("#sn"); sn.value=startup==="Carinderia Go"?"":startup;
    const b=el("button","btn gold","Start building"); b.type="submit"; b.style.marginTop="18px"; f.append(b);
    f.onsubmit=e=>{e.preventDefault();startup=sn.value.replace(/[\u0000-\u001f<>]/g,"").trim()||"Carinderia Go";M={dq:50,sec:50,tru:50};XP=0;picks=[];decision(0)};
    p.append(f);app.append(p);sn.focus();
  });
}
function paint(w){
  KEYS.forEach(k=>{const r=w.querySelector('[data-k="'+k+'"]'),v=M[k],i=r.querySelector("i");
    i.style.width=v+"%";i.className=v>=60?"":v>=35?"mid":"low";r.querySelector("b").textContent=v});
}
function meterEl(){
  const w=el("div","meters");
  KEYS.forEach((k,n)=>{const r=el("div","mt",'<span></span><div class="bar"><i></i></div><b></b>');r.dataset.k=k;r.firstChild.textContent=LABELS[n];w.append(r)});
  paint(w);return w;
}
function decision(i){
  go(()=>{
    const S=STAGES[i];
    app.append(hud("XP "+XP));
    const p=panel("Decision "+(i+1)+" of "+STAGES.length,S.title);
    const mt=meterEl(), opts=el("div","opts");
    p.append(txt("p","mod",S.mod),txt("p","story",S.story),mt);
    shuffle(S.opts).forEach(o=>{
      const b=el("button","opt"); b.textContent=o.t;
      b.onclick=()=>choose(i,o,p,opts,mt);
      opts.append(b);
    });
    p.append(opts);app.append(p);
  });
}
function choose(i,o,p,opts,mt){
  const S=STAGES[i], bs=[...opts.children];
  bs.forEach(b=>b.disabled=true);
  const bestT=S.opts.find(x=>x.xp===10).t;
  bs.forEach(b=>{if(b.textContent===bestT)b.classList.add("ok");else if(b.textContent===o.t)b.classList.add(o.xp?"sel":"bad")});
  XP+=o.xp;picks.push(o);
  KEYS.forEach((k,n)=>{M[k]=Math.max(0,Math.min(100,M[k]+o.m[n]))});
  setXP(XP);paint(mt);Music.sfx(o.xp>=5);
  const dl=el("div","deltas");
  KEYS.forEach((k,n)=>{const d=o.m[n];if(d)dl.append(txt("span","dl "+(d>0?"up":"down"),LABELS[n]+" "+(d>0?"+":"")+d))});
  const head=o.xp===10?"+10 XP. Best choice.":o.xp===5?"+5 XP. Okay, but not ideal.":"+0 XP. Risky choice.";
  const fb=el("div","fb "+(o.xp===10?"ok":"bad"),"<b></b><span></span>");
  fb.querySelector("b").textContent=head;fb.querySelector("span").textContent=o.res;
  const last=i===STAGES.length-1, nx=el("button","btn gold",last?"Launch the product":"Next decision");
  nx.style.marginTop="16px";nx.onclick=()=>{if(last)launch();else decision(i+1)};
  p.append(dl,fb,nx);nx.focus();
}
function launch(){
  go(()=>{
    app.append(hud("XP "+XP));
    const p=panel("Launch","Launching "+startup);
    p.append(txt("p","story","Deploying the app, opening the doors, and waiting for the first customers..."));
    const pr=el("div","progress"), bar=el("i"); pr.append(bar); p.append(pr); app.append(p);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width="100%"}));
    const t=setTimeout(()=>{Music.sfx(true);results()},REDUCED_MOTION?200:2400);
    cleanup=()=>clearTimeout(t);
  });
}
const REDUCED_MOTION=matchMedia("(prefers-reduced-motion: reduce)").matches;

function buildProduct(F){
  const app2=el("div","app");
  const orders=Math.round(M.tru*13), rating=(1+(M.dq+M.sec+M.tru)/75).toFixed(1);
  const top=el("div","top2"), nm=el("b"), cart=el("span","","Cart: 0"); nm.textContent=startup; top.append(nm,cart);
  const sub=el("div","sub"); sub.textContent="Delivering across "+(F.data==="dirty"?"Manilla":"Manila");
  app2.append(top,sub);
  const alert=(c,s)=>{const a=el("div","alert "+c);a.textContent=s;app2.append(a)};
  alert(F.sec==="roles"?"good":F.sec==="pwonly"?"warn":"bad",F.sec==="roles"?"Secure: role-based access is on.":F.sec==="pwonly"?"Basic protection: one password, no roles.":"Warning: a shared admin login is in use. Data may leak.");
  if(F.data==="dirty")alert("warn","Data issue: duplicate items and a blank price.");
  if(F.data==="ai")alert("warn","One price looks wrong: Pancit canton shows P7.");
  if(F.data==="clean")alert("good","Menu data is clean and checked.");
  alert(F.db==="linked"?"good":F.db==="onetable"?"warn":"bad",F.db==="linked"?"Orders are linked to customers.":F.db==="onetable"?"Search is slow: everything is in one big table.":"Orders live in a spreadsheet. Some may be lost.");
  const ul=el("ul","menu"); let n=0;
  MENU[F.data].forEach(([s,pr])=>{
    const li=el("li"), sp=el("span"); sp.textContent=s+"  "+(pr==="blank"?"P ?":"P"+pr);
    const b=el("button","add","Add"); b.onclick=()=>{n++;cart.textContent="Cart: "+n};
    li.append(sp,b);ul.append(li);
  });
  app2.append(ul);
  const msg=el("div","msg","Try it: add an item, then place or edit an order."), acts=el("div","acts");
  const place=el("button","","Place order"), edit=el("button","alt","Edit order");
  place.onclick=()=>{
    if(!n){msg.textContent="Your cart is empty. Add an item first.";return}
    let s="Order placed. ";
    if(F.data==="dirty")s+="The total shows P0 because a price was blank. ";
    if(F.data==="ai")s+="Pancit canton was charged at P7, which nobody checked. ";
    s+=F.db==="linked"?"Saved to your order history.":F.db==="onetable"?"Saved, but your name is repeated in every row.":"Saved to a spreadsheet. Someone overwrote the last order.";
    msg.textContent=s;
  };
  edit.onclick=()=>{
    msg.textContent=F.app==="safe"?"Order updated. Only your order changed.":F.app==="inject"?"Someone typed a trick into the form and changed every order. That is SQL injection.":"Editing is not available yet. You skipped that feature.";
  };
  acts.append(place,edit);app2.append(acts,msg);
  const st=el("div","stats3");
  [["Week 1 orders",orders],["Rating",rating+"/5"],["Trust",M.tru+"%"]].forEach(([l,v])=>{const d=el("div");d.append(txt("b","",String(v)),document.createTextNode(l));st.append(d)});
  app2.append(st);
  return app2;
}
function results(){
  go(()=>{
    const F={};STAGES.forEach((S,i)=>{F[S.key]=picks[i].f});
    const rank=RANKS.find(r=>XP>=r[0])[1], avg=(M.dq+M.sec+M.tru)/3;
    app.append(hud("XP "+XP));
    const p=panel("Results","Launch day!"), st=txt("p","stat","");
    p.append(el("div","big",XP+" XP"),txt("p","stat",rank),
      txt("p","stat",avg>=70?"A strong launch. Customers love it.":avg>=45?"A shaky launch. Some parts worked and some did not.":"A rough launch. Time to fix the basics."),
      txt("p","stat","Your best on this device: "+best("launchday",XP)+" XP"));
    p.append(meterEl());
    const inv={users:"Investors loved your real user numbers.",features:"Investors liked the product but worried about the cost.",hype:"Investors asked for proof you did not have."}[F.pitch];
    p.append(txt("p","stat",inv),st);
    const two=el("div","two"), a=el("button","btn gold","Play again"), c=el("button","btn","Change player");
    a.onclick=intro;c.onclick=home;two.append(a,c);p.append(two);
    const pp=panel("Your product","Launched: "+startup);
    pp.append(txt("p","hint","This is the product your 5 decisions built. Try its buttons to see how it behaves."),buildProduct(F));
    const rp=panel("Recap","Your 5 decisions"), ol=el("ol","recap");
    STAGES.forEach((S,i)=>{const li=el("li");li.append(txt("b","",S.title+" (+"+picks[i].xp+" XP): "),txt("span","",picks[i].res));ol.append(li)});
    rp.append(ol);
    const bd=boardPanel("launchday");
    app.append(p,pp,rp,bd);
    save("launchday",XP,picks.filter(x=>x.xp===10).length,st,bd);
  });
}
const START=intro;
home();
</script>
</body>
</html>
